# czsc_mi 配置模板 —— 机器绝对路径一律走环境变量
# 未设置 MYSTERY_DB_PATH 时使用仓库内 data/mystery_cache.db
db_path: ${MYSTERY_DB_PATH}

data_source:
  primary: ths_official
  fallback: [tdx_local]        # 与 adapters/market.py 降级顺序一致（db→ths→tdx_local）
  adjust: qfq
  resample_engine: mystery

chan:
  enabled: false          # 环境变量 MYSTERY_CHAN_ENABLED 可覆盖
  freqs: [1d, 1w]

scoring:
  mystery: 0.55
  resonance: 0.25
  chan: 0.20

report:
  output_dir: ${MYSTERY_REPORT_DIR:-}
